<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Professional accounting software by Webzio." />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />
    <title>BillAura</title>
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      .splash-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        background-color: #ffffff;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
      }
      .splash-container.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      .splash-logo {
        width: 150px;
        height: auto;
        animation: pulse 2s infinite ease-in-out;
        will-change: transform, opacity;
      }
      .splash-text {
        margin-top: 1.5rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 0.875rem;
        font-weight: 500;
        color: #64748b;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(0.95); opacity: 0.8; }
      }
      @media (prefers-color-scheme: dark) {
        .splash-container {
          background-color: #0f172a; /* Tailwind slate-900 */
        }
        .splash-text {
          color: #94a3b8;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" class="splash-container">
      <img src="/logo.png" alt="BillAura Logo" class="splash-logo" />
      <div class="splash-text">Initializing Bill Aura...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
